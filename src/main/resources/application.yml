server:
    port: ${PORT}

spring:
    application:
        name: SchemaDoc Maker

  #datasource
    datasource:
        url: ${DB_URL_NAME}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: ${DB_DRIVER}

#Open api swagger ui
springdoc:
    api-docs:
        path: /api-docs
    swagger-ui:
        persist-authorization: true
        tags-sorter: alpha
        doc-expansion: list  # none | list | full


api:
    prefix: ${PREFIX} 